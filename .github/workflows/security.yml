name: Security

# Six independent checks, each uploaded as SARIF so findings appear in the
# repository's Security tab rather than only in a log nobody reads:
#
#   secrets      - gitleaks over the full history
#   python-sast  - bandit (plus ruff's `S` rules run in the CI workflow)
#   python-deps  - pip-audit against the pinned requirements
#   node-deps    - npm audit against the lockfile
#   licenses     - license-report.mjs over both dependency closures
#   actions      - zizmor over the workflows themselves
#
# Findings are advisory by default: dependency CVEs and heuristic SAST rules
# produce false positives, and a red build on every unrelated advisory trains
# people to ignore the check. Two jobs fail the build unconditionally, because
# neither has a defensible false positive: a leaked secret, and a dependency
# that cannot legally be distributed under AGPL-3.0.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, so a newly published advisory is caught without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret may only exist in an old commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  # ---------------------------------------------------------------------------
  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: python -m pip install --upgrade pip bandit[sarif]

      - name: Run bandit
        working-directory: apps/api
        # -ll reports medium and above; low-severity findings are mostly noise
        # in code that legitimately shells out to OpenCV and the filesystem.
        run: bandit -r sightrail -c pyproject.toml -ll -f sarif -o bandit.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apps/api/bandit.sarif
          category: bandit

  # ---------------------------------------------------------------------------
  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: pip-audit
        working-directory: apps/api
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python pip-audit
          # --strict fails the step on any vulnerability; keep it advisory so a
          # transitive CVE in torch does not block unrelated work, but make the
          # result visible in the job summary.
          .venv/bin/python -m pip_audit --strict --progress-spinner off | tee audit.txt
        continue-on-error: true

      - name: Summarise audit
        if: always()
        run: |
          {
            echo "## Python dependency audit"
            echo '```'
            cat apps/api/audit.txt 2>/dev/null || echo "audit output unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  node-deps:
    name: Node dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm audit
        run: |
          npm audit --audit-level=high --omit=dev | tee audit.txt || true
          npm audit --audit-level=high || true
        continue-on-error: true

      - name: Summarise audit
        if: always()
        run: |
          {
            echo "## Node dependency audit"
            echo '```'
            cat audit.txt 2>/dev/null || echo "audit output unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  licenses:
    name: License compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install API dependencies
        # The web closure is read from the committed package-lock.json, so only
        # the Python side needs a real environment.
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r apps/api/requirements.txt

      - name: License report
        # Unlike the audits above, this failure is never a false positive: a
        # GPL/SSPL/BUSL component means the distribution would be unlawful.
        run: npm run license:report | tee license-report.txt

      - name: Summarise report
        if: always()
        run: |
          {
            echo "## License report"
            echo '```'
            cat license-report.txt 2>/dev/null || echo "report unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  actions-security:
    name: Workflow hardening (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: python -m pip install --upgrade pip zizmor

      - name: Audit workflows
        # Checks for the things that make Actions a supply-chain risk:
        # unpinned actions, `pull_request_target`, over-broad permissions.
        run: zizmor --format sarif .github/workflows > zizmor.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
